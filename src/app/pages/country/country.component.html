<div class="grid">
  <div class="span-all">
    <app-header [titlePage]="countryName" [items]="indicators"></app-header>
  </div>
  @if (isLoading) {
    <app-spinner></app-spinner>
  } @else {
    <div class="chart-panel">
      <app-countrycard [participations]="countryParticipations"></app-countrycard>
    </div>
    <div class="side-card side-panel">
      <button routerLink="/" class="btn" aria-label="Back to home page">Back</button>
    </div>
  }
</div>
